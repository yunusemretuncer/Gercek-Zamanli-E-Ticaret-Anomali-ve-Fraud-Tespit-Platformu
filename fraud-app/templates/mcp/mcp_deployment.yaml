apiVersion: apps/v1
kind: Deployment
metadata: 
  name: {{ include "fraud-platform.mcp.fullname" . }}
  labels:
    app: {{ include "fraud-platform.mcp.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "fraud-platform.mcp.fullname" . }}
  template:
    metadata:
      name: {{ include "fraud-platform.mcp.fullname" . }}
      labels:
        app: {{ include "fraud-platform.mcp.fullname" . }}
    spec:
      enableServiceLinks: false
      containers:
      - name: {{ include "fraud-platform.mcp.fullname" . }}
        image: gercek-zamanli-e-ticaret-anomali-ve-fraud-tespit-platformu-mcp
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: {{ include "fraud-platform.mcp.fullname" . }}-config
        - secretRef:
            name: {{ include "fraud-platform.mcp.fullname" . }}-secret