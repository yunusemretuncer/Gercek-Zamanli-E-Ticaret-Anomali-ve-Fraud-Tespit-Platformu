apiVersion: v1
kind: Service
metadata:
  name: {{ include "fraud-platform.db.fullname" . }}
spec:
  type: ClusterIP
  ports:
  - name: {{ include "fraud-platform.db.fullname" . }}
    port: {{ .Values.db.port}}
    targetPort: {{ .Values.db.port}}
  selector:
    app: {{ include "fraud-platform.db.fullname" . }}